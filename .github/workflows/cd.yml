name: CD - Deploy to Home Server (tkm2)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/cd.yml'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ tab Actions trên GitHub

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Backend & Database on tkm2
    runs-on: [self-hosted, windows, tkm2]
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Environment Configuration
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "1. Kiểm tra cấu hình môi trường (.env)..."
          Write-Host "=========================================="
          $masterEnv = "C:\Users\tkm2\SmartMeal\backend\.env"
          if (Test-Path $masterEnv) {
            Write-Host "✓ Tìm thấy file .env chuẩn tại: $masterEnv"
            Copy-Item -Path $masterEnv -Destination "backend\.env" -Force
            Write-Host "✓ Đã sao chép an toàn vào thư mục build (backend\.env)."
          } else {
            Write-Error "CRITICAL: Không tìm thấy file .env gốc tại $masterEnv!"
            exit 1
          }

      - name: Deploy Backend Container
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "2. Khởi động Docker Compose Build & Deploy..."
          Write-Host "=========================================="
          docker compose up -d --build backend-api
          if ($LASTEXITCODE -ne 0) {
            Write-Error "docker compose up thất bại với mã lỗi $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "✓ Container backend-api đã được build và kích hoạt thành công!"

      - name: Clean Dangling Images
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "3. Dọn dẹp Docker images cũ (prune)..."
          Write-Host "=========================================="
          docker image prune -f
          Write-Host "✓ Đã dọn dẹp bộ nhớ đệm image thành công."

      - name: Health Check & Swagger Validation
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "4. Chạy Health Check & Kiểm tra API..."
          Write-Host "=========================================="
          Write-Host "Chờ 15 giây để ASP.NET Core hoàn thành Database Migration & khởi động..."
          Start-Sleep -Seconds 15

          $url = "http://localhost:5000/swagger/v1/swagger.json"
          $maxRetries = 6
          $success = $false

          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Lần thử $i/$maxRetries: Đang kiểm tra endpoint $url..."
            try {
              $res = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 10
              if ($res.StatusCode -eq 200) {
                Write-Host "✓ Swagger Endpoint phản hồi HTTP 200 OK!"
                $success = $true
                break
              }
            } catch {
              Write-Host "Chưa sẵn sàng, thử lại sau 5 giây... (Lỗi: $($_.Exception.Message))"
              Start-Sleep -Seconds 5
            }
          }

          if (-not $success) {
            Write-Error "CRITICAL: Health Check thất bại! Không thể kết nối tới Swagger sau $maxRetries lần thử."
            docker ps --filter "name=smartmeal_api"
            docker logs --tail 50 smartmeal_api
            exit 1
          }

          Write-Host "=========================================="
          Write-Host "🚀 DEPLOY HOÀN TẤT THÀNH CÔNG 100%!"
          Write-Host "=========================================="
          docker ps --filter "name=smartmeal"
