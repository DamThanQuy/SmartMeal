name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore and test
        working-directory: backend
        env:
          SMARTMEAL_TEST_DB: Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres;Database=postgres
        run: dotnet test SmartMeal.sln --configuration Release

  frontend:
    name: Frontend typecheck, lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/SmartMealMobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/SmartMealMobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Jest (unit tests; live API tests require a running backend)
        run: npm test -- --runInBand --testPathIgnorePatterns='__tests__/live/|__tests__/App.test.tsx'
