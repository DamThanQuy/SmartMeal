version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: smartmeal_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: SmartMealDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. pgAdmin (Web GUI for Database)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartmeal_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartmeal.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # 3. ASP.NET Core API
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartmeal_api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=SmartMealDb;Username=postgres;Password=postgrespassword
      - Jwt__Key=SmartMeal_SuperSecret_Jwt_Security_Key_2026_FPT_PRM393_VeryLongAndSecureKey!
      - Jwt__Issuer=SmartMealBackend
      - Jwt__Audience=SmartMealMobile
    ports:
      - "5000:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
