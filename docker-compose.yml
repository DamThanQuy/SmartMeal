version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartmeal_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: SmartMealDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartmeal_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartmeal.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
